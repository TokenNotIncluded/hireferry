<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">HireFerry — private recruiting, shared progress</title>
  <desc id="desc">A sailboat crosses a quiet field of particles. HireFerry brings people and opportunities together through human HR and authorized AI. The illustration adapts to light and dark color schemes.</desc>
  <style>
    .paper { fill: #f5f3ed; }
    .ink { fill: #181917; }
    .muted { fill: #66675f; }
    .border { fill: none; stroke: #d8d5cb; }
    .line { fill: none; stroke: #181917; stroke-linecap: round; stroke-linejoin: round; }
    .wake { fill: none; stroke: #a8aa9b; stroke-linecap: round; }
    .particle { fill: #9c9f8b; }
    .sun { fill: #d0b885; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #181917; }
      .ink { fill: #f5f3ed; }
      .muted { fill: #b6b3a9; }
      .border { stroke: #3d3e37; }
      .line { stroke: #f5f3ed; }
      .wake { stroke: #747968; }
      .particle { fill: #a5aa92; }
      .sun { fill: #b79c63; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <rect class="paper" width="960" height="360" rx="24"/>
  <rect class="border" x="0.5" y="0.5" width="959" height="359" rx="23.5"/>
  <text class="ink" x="48" y="112" font-size="72" font-weight="600" letter-spacing="-3" style="font-family: Georgia, 'Times New Roman', serif">HireFerry</text>
  <text class="ink" x="52" y="176" font-size="31" letter-spacing="-0.5">Private recruiting.</text>
  <text class="ink" x="52" y="216" font-size="31" letter-spacing="-0.5">Shared progress.</text>
  <text class="muted" x="53" y="300" font-size="22">Human HR + authorized AI</text>
  <circle class="sun" cx="813" cy="91" r="34"/>
  <g class="line" stroke-width="3">
