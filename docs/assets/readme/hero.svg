    <circle cx="588" cy="192" r="3.5"/><circle cx="610" cy="166" r="2"/>
    <circle cx="634" cy="140" r="3"/><circle cx="660" cy="120" r="2"/>
    <circle cx="684" cy="96" r="3.5"/><circle cx="713" cy="72" r="2"/>
    <circle cx="714" cy="188" r="2"/><circle cx="724" cy="167" r="2.5"/>
    <circle cx="738" cy="147" r="2"/><circle cx="735" cy="189" r="3"/>
    <circle cx="797" cy="181" r="2.5"/><circle cx="810" cy="193" r="2"/>
