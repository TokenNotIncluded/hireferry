    <path d="M754 77 V205 H651 Z"/>
    <path d="M770 108 L840 205 H770 Z"/>
    <path d="M754 220 V205"/>
  </g>
  <g class="wake" stroke-width="1.5">
    <path d="M560 273 C616 253 650 291 710 275 S801 261 858 274"/>
    <path d="M610 298 C670 280 700 312 760 298 S831 288 875 298"/>
