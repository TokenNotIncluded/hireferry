# Local development ONLY / 仅用于本机开发
# This mode is rejected unless bind and public_url both use loopback addresses.
# With SMTP disabled, the email API returns dev_code and the UI displays it.
# It never simulates successful payments or creates sample accounts/data.
bind = "127.0.0.1:3000"
public_url = "http://localhost:3000"
webauthn_rp_id = "localhost"
database = "data/hireferry.sqlite3"
development = true
session_hours = 24

[site]
name = "HireFerry · 聘渡"
support_email = "support@lmm.best"
default_language = "zh"
source_url = "https://github.com/TokenNotIncluded/hireferry"

[google]
enabled = false
client_id = ""
client_secret = ""
# Local redirect URI: http://localhost:3000/auth/google/callback

[humangrant]
enabled = true
client_ids = ["hireferry-web", "hireferry-cli"]
request_ttl_seconds = 600
max_grant_seconds = 86400
request_limit_per_hour = 12
service_limit_per_hour = 600

[smtp]
enabled = false
host = ""
port = 587
username = ""
password = ""
from = ""
reply_to = "support@lmm.best"
starttls = true

[payments.stripe]
enabled = false
allowed_currencies = []
secret_key = ""
webhook_secret = ""
live_mode = false

[payments.waffo]
enabled = false
allowed_currencies = [] # CNY/EUR/GBP/HKD/JPY/USD only; must match your actual product.
base_url = "https://api.waffo.ai"
merchant_id = ""
store_id = ""
product_id = ""
private_key_pem = ""
webhook_public_key_pem = ""
tax_category = ""
mode = "test"

[pricing]
# Currency codes are explicit. Existing jobs/orders keep their original currency.
# Empty allowed_currencies means only currency; add per-currency amounts below
# before enabling additional currencies. No automatic exchange conversion.
currency = "CNY"
allowed_currencies = ["CNY"]
onboarding_cents = 10000 # Integer minor units of currency; 0 activates for free.
publish_mode = "salary_percent" # salary_percent, fixed, or free
publish_bps = 1000 # 10000 basis points = 100%; used by salary_percent.
publish_fixed_minor = 30000 # Used only by fixed mode, in this currency's minor unit.
edit_mode = "salary_percent" # Snapshot is retained for the lifetime of each job.
edit_bps = 100 # Percentage of the original base salary, not the publication fee.
edit_fixed_minor = 3000
max_edits = 3 # Applies to JD edits; headcount changes and deletion stay free.
employer_ai_min_salary_minor = 300000 # 0 removes the salary threshold for new jobs.

# Example: add USD to allowed_currencies, then set its independent amounts.
# Values are business settings, not exchange rates; review before enabling.
# [pricing.currency_amounts.USD]
# publish_fixed_minor = 30000
# edit_fixed_minor = 3000
# employer_ai_min_salary_minor = 300000
# For JPY/KRW, one minor unit is one yen/won (no multiplication by 100).

[limits]
max_job_headcount = 1000000 # Maximum value, not a limit on free modifications.
max_pending_orders_per_user = 20
list_page_size = 50
list_max_page = 2000
workbench_page_size = 25
recent_list_limit = 200

# Outbound webhooks retain the same public HTTPS-only restrictions in development.
# Tests inject a transport; HTTP/localhost bypasses are never enabled.
[webhooks]
enabled = true
max_endpoints = 5
max_attempts = 5
max_pending_per_endpoint = 1000
request_timeout_secs = 5
max_response_bytes = 16384
poll_interval_secs = 5
delivered_retention_days = 30
failed_retention_days = 90

[cli_auth]
enabled = true
client_id = "hireferry-cli"
allowed_scopes = ["identity", "mcp", "admin"]
access_token_minutes = 15
refresh_token_days = 30
code_seconds = 120
grant_minutes = 10
poll_seconds = 5
max_active_tokens = 10
rate_limit_requests = 100
rate_limit_window_seconds = 300
max_user_code_attempts = 30
max_pending_grants = 1000

