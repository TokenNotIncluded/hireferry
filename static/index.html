  <meta name="description" content="聘渡 HireFerry · AI 原生简历初筛与人才自动匹配。AI 自动理解需求并匹配人选，全在线交付。求职免费，招聘按次付费。">
  <title>聘渡 HireFerry · 人才双向匹配服务</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    (() => {
      const root = document.documentElement;
      const valid = value => ['system', 'light', 'dark'].includes(value);
      const defaultTheme = root.dataset.defaultTheme || 'light';
      let preference = defaultTheme;
      try {
        const saved = localStorage.getItem('hireferry-theme');
        if (valid(saved)) preference = saved;
      } catch {}
      const theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : preference;
      root.dataset.theme = theme;
      root.dataset.themePreference = preference;
      root.classList.toggle('dark', theme === 'dark');
      root.classList.toggle('light', theme === 'light');
    })();
  </script>
  <script defer src="/static/theme.js"></script>
