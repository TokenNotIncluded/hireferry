<!doctype html>
<html lang="zh-CN" class="light" data-theme="light" data-palette="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="referrer" content="no-referrer">
  <title>命令行连接 · HireFerry</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/theme-palettes.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/cli-auth.css">
  <link rel="stylesheet" href="/static/brand-motion.css">
  <script type="module" src="/static/cli-connections.js"></script>
</head>
<body>
  <header><a href="/" class="brand"><svg class="brand-mark" viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><path d="M5 24h30l-8 10H13zM18 4v17H4zM22 8l12 13H22z"/></svg>聘渡 <span>HireFerry</span></a><button id="language" type="button" aria-label="Switch language">EN</button></header>
  <main>
    <h1 data-text="title">命令行连接</h1>
    <p class="intro" data-text="intro">管理已授权的终端连接。</p>
    <section class="card" aria-labelledby="account">
      <h2 id="account" data-text="account">当前账户</h2>
      <p id="status" role="status" aria-live="polite">正在检查登录状态 / Checking your sign-in…</p>
      <p id="error" role="alert" hidden></p>
      <div id="sign-in" hidden>
        <div class="actions"><a id="member-login" href="/login" class="button primary" data-text="memberLogin">Google / 邮箱登录</a><a id="admin-login" href="/admin" class="button" data-text="adminLogin">管理员 Passkey 登录</a></div>
      </div>
      <div id="connections"></div>
      <div class="actions"><button id="refresh" type="button" data-text="refresh">刷新列表</button><a id="workspace" class="button" href="/app" data-text="workspace">打开工作台</a></div>
    </section>
    <noscript>请启用 JavaScript 后继续。Enable JavaScript to continue.</noscript>
  </main>
</body>
</html>
