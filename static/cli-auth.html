<!doctype html>
<html lang="zh-CN" class="light" data-theme="light" data-palette="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="referrer" content="no-referrer">
  <title>连接 hfy · HireFerry CLI</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/theme-palettes.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/cli-auth.css">
  <link rel="stylesheet" href="/static/feedback.css">
  <script type="module" src="/static/cli-auth.js"></script>
  <script type="module" src="/static/feedback-ui.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到主要内容 / Skip to content</a>
  <header class="cli-header"><a href="/" class="brand" aria-label="HireFerry home"><svg class="brand-mark" viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><path d="M5 24h30l-8 10H13zM18 4v17H4zM22 8l12 13H22z"/></svg><span>聘渡</span><span class="brand-en">HireFerry</span></a><div class="cli-header-controls"><a class="cli-help-link" href="/cli">CLI 指南 / Guide</a><details class="theme-menu"><summary aria-label="切换主题 / Change theme" title="Theme">◐</summary><div class="theme-panel"><div class="palette-options" role="group" aria-label="Color palette"><button type="button" class="palette-swatch" data-palette-choice="neutral" title="纸墨 / Paper &amp; ink" aria-label="纸墨 / Paper &amp; ink" aria-pressed="false"><span class="swatch-color">✓</span></button><button type="button" class="palette-swatch" data-palette-choice="blue" title="Ocean blue" aria-label="Ocean blue" aria-pressed="false"><span class="swatch-color">✓</span></button><button type="button" class="palette-swatch" data-palette-choice="violet" title="Violet" aria-label="Violet" aria-pressed="false"><span class="swatch-color">✓</span></button><button type="button" class="palette-swatch" data-palette-choice="rose" title="Rose" aria-label="Rose" aria-pressed="false"><span class="swatch-color">✓</span></button><button type="button" class="palette-swatch" data-palette-choice="amber" title="Amber" aria-label="Amber" aria-pressed="false"><span class="swatch-color">✓</span></button><button type="button" class="palette-swatch" data-palette-choice="teal" title="Teal" aria-label="Teal" aria-pressed="false"><span class="swatch-color">✓</span></button></div><div class="mode-options" role="group" aria-label="Appearance"><button type="button" data-theme-choice="light" aria-label="Light" title="Light" aria-pressed="false">☀</button><button type="button" data-theme-choice="dark" aria-label="Dark" title="Dark" aria-pressed="false">☾</button><button type="button" data-theme-choice="system" aria-label="System" title="System" aria-pressed="false">▣</button></div></div></details><button id="language" type="button" class="language" aria-label="Switch language">EN</button></div></header>
  <main id="main" class="cli-content">
    <h1 data-text="title">连接 hfy</h1>
    <p class="intro" data-text="intro">确认账户与权限后继续。</p>
    <section class="card" aria-labelledby="request-title">
      <h2 id="request-title" data-text="requestTitle">授权详情</h2>
      <p id="status" role="status" aria-live="polite">正在检查登录状态 / Checking your sign-in…</p>
      <p id="error" role="alert" hidden></p>
      <form id="code-form" hidden>
        <label for="user-code" data-text="codeLabel">输入终端显示的设备码</label>
        <input id="user-code" name="user_code" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" required>
        <button class="primary" type="submit" data-text="continue">继续</button>
      </form>
      <div id="sign-in" hidden>
        <p data-text="signInHelp">登录后确认本次连接。</p>
        <div class="actions"><a href="/login" id="member-login" class="button primary" data-text="memberLogin">Google / 邮箱登录</a><a href="/admin" id="admin-login" class="button" data-text="adminLogin">管理员 Passkey 登录</a></div>
      </div>
      <div id="consent" aria-describedby="status error" hidden>
        <dl><dt data-text="siteLabel">网站</dt><dd id="site"></dd><dt data-text="accountLabel">当前账户</dt><dd id="account"></dd><dt data-text="clientLabel">客户端</dt><dd id="client"></dd><dt data-text="scopeLabel">权限范围</dt><dd id="scope"></dd></dl>
        <div id="code-confirm" class="code-confirm" hidden><span data-text="compareCode">请确认设备码与你的终端一致</span><strong id="display-code"></strong></div>
        <p id="permissions"></p>
        <p class="warning" data-text="ownRequest">请确认请求来自你正在登录的终端。</p>
        <p class="hint" data-text="revokeHelp">运行 hfy auth logout 或撤销连接即可结束授权。</p>
        <a class="hint" href="/oauth/connections" target="_blank" rel="noopener" data-text="manageConnections">管理连接</a>
        <div class="actions"><button id="approve" class="primary" type="button" data-text="approve">允许连接</button><button id="deny" type="button" data-text="deny">拒绝</button><button id="switch-account" class="text-button" type="button" data-text="switchAccount">切换账户</button></div>
      </div>
      <div id="recover" class="actions" hidden><button id="retry" type="button" data-text="retry">重新检查</button><a id="workspace" href="/app" class="button" data-text="workspace">打开工作台</a><a id="reauth" href="/admin?tab=keys" class="button" hidden data-text="reauth">重新验证 Passkey</a></div>
    </section>
    <noscript>请启用 JavaScript 后继续。Enable JavaScript to continue.</noscript>
  </main>
</body>
</html>
