<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HireFerry · 聘渡</title>
  <link rel="stylesheet" href="style.css">
  <script src="server-origin.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 64 64"><rect width="64" height="64" rx="18"/><path d="M12 35h40L42 48H23zM30 12v19H13zM35 16l15 15H35z"/></svg>
        <span>聘渡 <span class="brand-en">HireFerry</span></span>
      </div>
      <button class="language" id="language" type="button" aria-label="Switch language">EN</button>
    </header>

    <main>
      <section class="intro" aria-labelledby="heading">
        <p class="eyebrow" data-i18n="eyebrow">你的桌面工作台</p>
        <h1 id="heading" data-i18n="heading">让人才与机会，<br>在此相遇。</h1>
        <p class="lead" data-i18n="lead">一扇轻巧的窗口，连接你的聘渡。<br>继续每一次沟通，开启下一段旅程。</p>
        <svg class="voyage" viewBox="0 0 360 185" role="img" aria-labelledby="voyage-title">
          <title id="voyage-title">HireFerry ferry</title>
          <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1"/></pattern></defs>
          <rect class="dots" width="360" height="185" fill="url(#dots)"/>
          <path class="route" d="M15 148C65 92 100 178 154 133S249 49 339 58"/>
          <g class="ferry">
            <path class="sail" d="M155 37v64h-62zM168 48l43 53h-43z"/>
            <path class="hull" d="M80 111h151l-29 34H111z"/>
            <path class="water" d="M79 157c16-7 29 8 44 0s29 8 44 0 29 8 44 0"/>
          </g>
          <circle class="destination" cx="333" cy="59" r="6"/>
          <circle class="destination-ring" cx="333" cy="59" r="16"/>
        </svg>
      </section>

      <section class="connection" aria-labelledby="connection-heading">
        <div class="connection-head">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-i18n="ready">准备就绪</span>
          <span class="desktop-label" id="platform-label">DESKTOP</span>
        </div>
        <h2 id="connection-heading" data-i18n="connectTitle">从这里出发</h2>
        <p class="form-description" data-i18n="connectDescription">使用官方服务，或连接你自己的聘渡站点。</p>
        <form id="connect-form">
          <label for="server" data-i18n="serverLabel">服务地址</label>
          <input id="server" name="server" type="url" value="https://hireferry.lmm.best" placeholder="https://hireferry.lmm.best" autocomplete="url" spellcheck="false" required aria-describedby="server-help status">
          <p class="field-help" id="server-help" data-i18n="serverHelp">使用 HTTPS 地址。本机开发可使用 http://localhost:3000。</p>
          <button class="primary" id="connect" type="submit"><span data-i18n="connectButton">进入工作台</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        </form>
        <button class="browser" id="browser" type="button"><span data-i18n="browserButton">在浏览器中打开</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m-1-5-9 9M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="login-note"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8v5m0 3h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg><p data-i18n="loginNote">桌面内可使用邮箱验证码登录。Google 登录请在浏览器中完成；浏览器与桌面的登录状态各自独立。</p></div>
      </section>
    </main>

    <footer>
      <span data-i18n="footer">人类 HR 与 AI，协作同行。</span>
      <span class="footer-help" data-i18n="footerHelp">连接设置可随时在应用菜单中重新打开。</span>
    </footer>
  </div>
</body>
</html>
