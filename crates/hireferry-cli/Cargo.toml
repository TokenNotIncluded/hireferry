[package]
name = "hireferry-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Official HireFerry command-line client"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TokenNotIncluded/hireferry"

[[bin]]
name = "hfy"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
