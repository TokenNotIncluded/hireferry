name: CLI release

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: matrix
        run: echo "value=$(python3 scripts/release.py matrix cli)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          {
            echo 'CC=musl-gcc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc'
          } >> "$GITHUB_ENV"

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Link the Windows C runtime statically
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"

      - name: Cache CLI build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.target }}
          cache-on-failure: true

      - name: Validate version and tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/hireferry-cli/Cargo.toml | head -n 1)
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == cli-v* ]]; then test "$REF_NAME" = "cli-v$version"; fi

      - name: Build and test native client
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked -p hireferry-cli --target "$TARGET"
          cargo build --locked --release -p hireferry-cli --target "$TARGET"
          binary="target/$TARGET/release/hfy"
          if [[ "$TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          "$binary" --version
          ./scripts/package-cli.sh --binary "$binary" --target "$TARGET" --out-dir dist/hfy

      - name: Smoke test Unix one-line installer
        if: runner.os != 'Windows'
        run: HFY_INSTALLER_PACKAGE_DIR="$PWD/dist/hfy" python3 tests/cli-installers.test.py

      - name: Smoke test Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/cli-installer-windows.ps1 -PackageDirectory ./dist/hfy

      - name: Upload archive and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-release-${{ matrix.target }}
          path: dist/hfy/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete CLI release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-release-*
          path: artifacts/cli-release

      - name: Assemble and verify all six packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py assemble-cli artifacts/cli-release dist/release \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || printf missing)
          if [[ "$state" == false ]]; then echo 'This release is already published; bump the CLI version.' >&2; exit 1; fi
          if [[ "$state" == missing ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "HireFerry CLI ${RELEASE_TAG#cli-v}" --notes-file dist/release/downloads.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/release/downloads.md --draft=false --latest

  update-docs:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-docs.yml
    with:
      tag: ${{ github.ref_name }}

  update-aur:
    needs: publish
    uses: ./.github/workflows/aur.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
