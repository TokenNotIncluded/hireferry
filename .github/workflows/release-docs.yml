name: Update download matrix

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag, for example desktop-v0.1.0 or cli-v0.1.2
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-download-documentation
  cancel-in-progress: false
  queue: max

jobs:
  update:
    if: github.event_name != 'release' || ((startsWith(github.event.release.tag_name, 'desktop-v') || startsWith(github.event.release.tag_name, 'cli-v')) && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Download the published manifest and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(desktop|cli)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > "$RUNNER_TEMP/release-metadata.json"
          gh release download "$RELEASE_TAG" --pattern downloads.json --pattern SHA256SUMS --dir "$RUNNER_TEMP/hfy-downloads"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hfy-downloads'
          metadata = json.loads((folder.parent/'release-metadata.json').read_text())
          assert not metadata['isDraft'] and not metadata['isPrerelease'], 'Only published stable releases update documentation'
          assert metadata['tagName'] == os.environ['RELEASE_TAG']
          expected = [line.split()[0] for line in (folder/'SHA256SUMS').read_text().splitlines()
                      if len(line.split()) == 2 and line.split()[1] == 'downloads.json']
          actual = hashlib.sha256((folder/'downloads.json').read_bytes()).hexdigest()
          assert expected == [actual], 'Download manifest checksum mismatch'
          manifest = json.loads((folder/'downloads.json').read_text())
          assert manifest['repository'] == os.environ['GITHUB_REPOSITORY']
          product = os.environ['RELEASE_TAG'].split('-v', 1)[0]
          assert manifest['releases'][product] == os.environ['RELEASE_TAG']
          PY
      - name: Generate documentation from actual published packages
        run: |
          python3 scripts/release.py docs --manifest "$RUNNER_TEMP/hfy-downloads/downloads.json"
          python3 scripts/release.py docs --check
      - name: Commit the updated download matrix
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/downloads.md docs/assets/release-matrix.svg release/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh download matrix for $RELEASE_TAG"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
