name: Rust and browser assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust application
        run: cargo test --locked

      - name: Check and test browser assets
        run: |
          for asset in static/*.js static/runtime/*.js; do
            node --input-type=module --check < "$asset"
          done
          node tests/home-story.test.mjs
          node tests/sculpture.test.mjs
          node tests/service-ui.test.mjs

      - name: Build Linux release
        run: cargo build --locked --release

      - name: Assemble release bundle
        run: |
          mkdir -p dist/hireferry/static/runtime
          cp target/release/hireferry README.md LICENSE THIRD_PARTY_NOTICES config.example.toml config.development.toml dist/hireferry/
          cp -r docs deploy dist/hireferry/
          cp static/runtime/NOTICE dist/hireferry/static/runtime/NOTICE
          tar -czf dist/hireferry-linux-x86_64.tar.gz -C dist hireferry

      - name: Upload Linux release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hireferry-linux-x86_64
          path: dist/hireferry-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
