name: Rust and browser assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustup default 1.99.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test server and command-line client
        run: cargo test --locked --workspace --no-fail-fast

      - name: Verify matching queries with 100,000 synthetic candidates
        run: cargo test --locked --test workbench -- --ignored --nocapture

      - name: Check and test browser assets
        run: |
          for asset in static/*.js static/runtime/*.js; do
            node --input-type=module --check < "$asset"
          done
          node --check examples/humangrant-client.mjs
          for suite in tests/*.test.mjs; do node "$suite"; done

      - name: Verify isolated skill installation and packaging scripts
        run: |
          python3 tests/cli-scripts.test.py
          python3 tests/release.test.py
          python3 tests/aur.test.py
          python3 scripts/release.py docs --check

      - name: Verify real browser and CLI authentication
        run: |
          cargo build --locked --workspace
          npm install --prefix "$RUNNER_TEMP/hfy-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/hfy-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          HFY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hfy-browser/node_modules/playwright/index.mjs" node tests/cli-browser.mjs
          HFY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hfy-browser/node_modules/playwright/index.mjs" node tests/cli-polish-browser.mjs
          HFY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hfy-browser/node_modules/playwright/index.mjs" node tests/admin-browser.mjs
          HFY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hfy-browser/node_modules/playwright/index.mjs" node tests/relations.browser.mjs
          HFY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hfy-browser/node_modules/playwright/index.mjs" node tests/feedback-language.browser.mjs
          HFY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/hfy-browser/node_modules/playwright/index.mjs" node tests/webmcp-lifecycle.browser.mjs

      - name: Build Linux release
        run: cargo build --locked --release --workspace

      - name: Assemble release bundle
        run: |
          mkdir -p dist/hireferry/static/runtime
          cp target/release/hireferry README.md LICENSE THIRD_PARTY_NOTICES config.example.toml config.development.toml dist/hireferry/
          cp -r docs deploy legal examples dist/hireferry/
          cp static/runtime/NOTICE dist/hireferry/static/runtime/NOTICE
          tar -czf dist/hireferry-linux-x86_64.tar.gz -C dist hireferry
          ./scripts/package-cli.sh --binary target/release/hfy --target x86_64-unknown-linux-gnu --out-dir dist/hfy

      - name: Upload Linux release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hireferry-linux-x86_64
          path: dist/hireferry-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux command-line client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hireferry-cli-linux-x86_64
          path: dist/hfy/
          if-no-files-found: error
          retention-days: 14

  cli-native:
    name: CLI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Test standalone client
        run: cargo test --locked -p hireferry-cli

      - name: Build and package standalone client
        run: |
          cargo build --locked --release -p hireferry-cli
          target=$(rustc -vV | sed -n 's/^host: //p')
          binary=target/release/hfy
          if [[ "$target" == *windows* ]]; then binary="$binary.exe"; fi
          ./scripts/package-cli.sh --binary "$binary" --target "$target" --out-dir dist/hfy

      - name: Upload client archive and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hireferry-cli-${{ matrix.os }}
          path: dist/hfy/
          if-no-files-found: error
          retention-days: 14
