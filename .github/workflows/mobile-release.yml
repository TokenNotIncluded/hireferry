name: Signed mobile packages

# Explicit maintainer dispatch only. PR validation uses mobile-build.yml and
# never reads distribution signing credentials or publishes a store release.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to sign
        required: true
        type: choice
        options: [android, ios]
      build_number:
        description: Positive iOS build number (ignored by Android)
        required: true
        default: '1'
        type: string
      ios_export_method:
        description: iOS distribution profile type
        required: true
        default: app-store-connect
        type: choice
        options: [app-store-connect, release-testing, debugging]

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-24.04
    environment: mobile-signing
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      NDK_VERSION: 29.0.13846066
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' "ndk;$NDK_VERSION" 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: desktop
      - name: Decode maintainer keystore in runner temporary storage
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 in the mobile-signing environment')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hireferry-release.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HF_ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build and verify signed APK and AAB
        env:
          HF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HF_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HF_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HF_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: python3 scripts/mobile.py build android --variant release --target aarch64 --format both --output artifacts/mobile/android
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hireferry-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: hireferry-android-signed-${{ github.sha }}
          path: artifacts/mobile/android/
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-15
    environment: mobile-signing
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install iOS project tools
        run: brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
      - run: npm ci
        working-directory: desktop
      - name: Validate signing inputs
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os
          keys = ('APPLE_DEVELOPMENT_TEAM', 'IOS_CERTIFICATE', 'IOS_CERTIFICATE_PASSWORD', 'IOS_MOBILE_PROVISION')
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit('Configure real iOS signing inputs: ' + ', '.join(missing))
          if not os.environ['BUILD_NUMBER'].isdigit() or int(os.environ['BUILD_NUMBER']) < 1:
              raise SystemExit('build_number must be a positive integer')
          PY
      - name: Build and verify signed IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPORT_METHOD: ${{ inputs.ios_export_method }}
        run: python3 scripts/mobile.py build ios --variant release --target aarch64 --build-number "$BUILD_NUMBER" --export-method "$EXPORT_METHOD" --output artifacts/mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: hireferry-ios-signed-${{ github.sha }}
          path: artifacts/mobile/ios/
          if-no-files-found: error
          retention-days: 14
